<form id="formGestor" class="fields" onsubmit="return false">

  <!-- FOTO -->
  <div class="form-section">
    <div class="section-label">Foto de Perfil</div>
    <div class="avatar-upload">
      <div class="av-preview">👤</div>
      <div class="av-info">
        <p>Foto do Gestor</p>
        <span>JPG, PNG ou WEBP · Máx. 5MB</span>
      </div>
      <input id="fotoPerfil" type="hidden">
      <button type="button" class="btn-upload">Escolher Foto</button>
    </div>
  </div>

  <!-- DADOS PESSOAIS -->
  <div class="form-section">
    <div class="section-label">Dados Pessoais</div>

    <div class="grid2">
      <div class="field">
        <label class="lbl">Nome</label>
        <input id="nome" class="inp" type="text" placeholder="Fernando">
      </div>

      <div class="field">
        <label class="lbl">Sobrenome</label>
        <input id="sobrenome" class="inp" type="text" placeholder="Gomes">
      </div>
    </div>

    <div class="field">
      <label class="lbl">E-mail Corporativo</label>
      <input id="email" class="inp" type="email" placeholder="fernando.gomes@senai.br">
      <span class="inp-hint">Um e-mail de convite será enviado automaticamente.</span>
    </div>

    <div class="grid2">
      <div class="field">
        <label class="lbl">CPF</label>
        <input id="cpf" class="inp" type="text" placeholder="000.000.000-00" maxlength="14">
      </div>

      <div class="field">
        <label class="lbl">Telefone</label>
        <input id="telefone" class="inp" type="text" placeholder="(31) 9 0000-0000">
      </div>
    </div>
  </div>

  <!-- DADOS PROFISSIONAIS -->
  <div class="form-section">
    <div class="section-label">Dados Profissionais</div>

    <div class="field">
      <label class="lbl">Cargo / Função</label>
      <input id="cargo" class="inp" type="text" placeholder="Gestor de Operações de T.I">
    </div>

    <div class="grid2">
      <div class="field">
        <label class="lbl">Departamento / Área</label>
        <select id="departamento" class="inp">
          <option value="" disabled selected>Selecione a área</option>
          <option>T.I & Inovação</option>
          <option>Recursos Humanos</option>
          <option>Produção Industrial</option>
          <option>Marketing Digital</option>
          <option>Administrativo</option>
          <option>Manutenção</option>
          <option>Qualidade</option>
        </select>
      </div>
    </div>
  </div>

  <!-- SEGURANÇA -->
  <div class="form-section">
    <div class="section-label">Segurança de Acesso ( DEFINIDA PELO USUÁRIO ! )</div>

    <div class="grid2">
      <div class="field">
        <label class="lbl">Senha de Acesso</label>
        <input id="senha" class="inp" type="password" placeholder="••••••••" minlength="8">
        <span class="inp-hint">Mínimo de 8 caracteres.</span>
      </div>

      <div class="field">
        <label class="lbl">Confirmar Senha</label>
        <input id="confirmarSenha" class="inp" type="password" placeholder="••••••••" minlength="8">
      </div>
    </div>
  </div>

  <!-- BOTÕES -->
  <div class="form-footer-btns">
    <button type="button" class="btn-submit" onclick="cadastrarGestor()">
      CADASTRAR GESTOR
    </button>

    <a href="painelEmpresa.html" class="btn-cancel">
      Cancelar
    </a>
  </div>

</form>
