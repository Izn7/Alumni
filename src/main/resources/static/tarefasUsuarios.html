<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestão de Estagiários | ALUMNI</title>



<link
	href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
	rel="stylesheet">

<link rel="stylesheet" href="css/tarefasUsuarios.css">



<script defer src="js/tarefasUsuarios.js"></script>

</head>



<body>



	<div class="amb"></div>

	<div class="sov" id="sov" onclick="closeSidebar()"></div>




	<aside class="sidebar" id="sb">

		<div class="sb-hd">

			<div class="nav-logo">

				<div class="logo-mark">GDE</div>

				<span class="logo-word">ALUMNI</span>

			</div>

			<button class="sb-close" onclick="closeSidebar()">✕</button>

		</div>



		<nav class="snav">

			<a href="#" class="on">Gestão de Estagiários</a> <a href="#">Relatórios</a>

			<a href="#">Configurações</a>

			<div class="sdiv"></div>

			<a href="#" class="logout">Sair</a>

		</nav>

	</aside>





	<nav class="nav">

		<div class="nav-in">

			<div class="nav-brand-wrapper">

				<button class="btn-back" onclick="voltarPagina()">
    ←
</button>



				<div class="nav-logo">

					<div class="logo-mark">GDE</div>

					<span class="logo-word">ALUMNI</span>

				</div>

			</div>



			<div class="nav-user-link">

				<div class="nav-avatar">AD</div>

				<div>

					<div class="nu-name">Administrador</div>

					<div class="nu-role">Gestor</div>

				</div>

			</div>

		</div>

	</nav>





	<main class="main">

		<div class="container">




			<div class="stats-row">

				<div class="stat-card">

					<div class="stat-icon orange"></div>

					<div>

						<div class="stat-val orange" id="stat-total">0</div>

						<div class="stat-lbl">Total de estagiários</div>

					</div>

				</div>



				<div class="stat-card">

					<div class="stat-icon green"></div>

					<div>

						<div class="stat-val green" id="stat-tasks-today">0</div>

						<div class="stat-lbl">Tarefas atribuídas hoje</div>

					</div>

				</div>



				<div class="stat-card">

					<div class="stat-icon amber"></div>

					<div>

						<div class="stat-val amber" id="stat-no-tasks">0</div>

						<div class="stat-lbl">Sem tarefas hoje</div>

					</div>

				</div>

			</div>





			<div class="filter-bar">



				<div class="search-wrap">

					<div class="search-icon"></div>



					<input type="text" id="search-input" placeholder="Buscar..."
						oninput="listarEstagiarios()">

				</div>



				<select id="sector-filter" onchange="listarEstagiarios()">

					<option value="">Todos os setores</option>

				</select>

			</div>





			<div class="table-container">

				<table class="interns-table">

					<thead>

						<tr>

							<th>Estagiário</th>

							<th>Cargo</th>

							<th>Email</th>

							<th>Ações</th>

						</tr>

					</thead>



					<tbody id="interns-tbody"></tbody>

				</table>

			</div>



			<div id="empty-state" class="empty-state" style="display: none">

				Nenhum estagiário encontrado.</div>



		</div>

	</main>





	<div id="painel-tarefas" class="painel-tarefas">



		<div class="painel-header">

			<h3 id="nome-estagiario">Estagiário</h3>

			<button onclick="fecharPainel()" class="btn-close">✕</button>

		</div>



		<div class="painel-search">

			<input type="text" id="busca-tarefa" placeholder="Buscar tarefa..."
				oninput="renderizarTarefas()">

		</div>



		<div id="lista-tarefas" class="lista-tarefas"></div>



		<div class="painel-footer">

			<button class="btn-cancel" onclick="fecharPainel()">Cancelar</button>

			<button class="btn-save" onclick="salvarTarefasSelecionadas()">Salvar</button>

		</div>



	</div>



</body>

</html>
