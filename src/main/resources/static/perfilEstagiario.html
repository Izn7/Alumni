<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Perfil | ALUMNI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/perfilEstagiario.css">
</head>
<body>
<div class="amb"></div>

<nav class="nav">
  <div class="nav-in">
    <a href="detalhesTarefa.html" class="nav-back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      VOLTAR
    </a>
    <div class="nav-logo">
      <img src="img/GDESENAI.png" alt="ALUMNI" class="logo-img" style="height:38px;width:auto;display:block"></div>
    <span class="nav-name" id="nomeTopo"></span>
  </div>
</nav>

<main class="main">
  <div class="container">
    <div class="profile-card">

      <div class="avatar-wrap">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Foto">
        <div ></div>
        <div class="edit-photo">
          <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
      </div>

     <h1 class="profile-name" id="nomeEstagiario"></h1>

      <div class="badges-row">
        <span class="badge badge-green">E-mail Educacional Ativo</span>
        <span class="badge badge-o">Score: 10.0</span>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <label>Pontos</label>
          <p>2.450 pts</p>
        </div>
        <div>
          
        </div>
        <div class="stat-box">
          <label>Tarefas</label>
          <p>48 / 50</p>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-group">
          <label>E-mail Educacional</label>
          <p id="emailEstagiario"></p>
        </div>
        <div class="info-group">
          <label>Curso</label>
         <p id="curso"></p>
        </div>
        
        <div class="info-group">
          <label>Início do Estágio</label>
          <p id="inicioEstagio"></p>
        </div>
      </div>

      <div class="actions">
       <a href="detalhesTarefa.html" class="btn-tasks">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Ver Tarefas
        </a>
        <a href="alterarSenha.html" class="btn-danger-outline">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Alterar Senha
        </a>
      </div>

    </div>
  </div>
</main>



<script src="js/sessao.js"></script>
<script src="js/perfilEstagiario.js"></script>
<script src="js/sessao.js"></script>
<script src="js/perfilEstagiario.js"></script>
</body>
</html>
